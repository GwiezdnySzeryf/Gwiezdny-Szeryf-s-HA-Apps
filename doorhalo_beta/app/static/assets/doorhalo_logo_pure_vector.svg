<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DoorHalo logo">
  <title>DoorHalo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1D2E"/>
      <stop offset="100%" stop-color="#18354E"/>
    </linearGradient>
    <linearGradient id="haBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42C7F7"/>
      <stop offset="100%" stop-color="#03A9F4"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1f33" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="988" height="988" rx="130" fill="url(#tile)"/>

  <!-- blue halo only, no side brackets -->
  <ellipse cx="512" cy="190" rx="160" ry="34"
           fill="none" stroke="url(#haBlue)" stroke-width="24" stroke-linecap="round"/>

  <!-- door + frame -->
  <g filter="url(#shadow)">
    <path d="M377 288 H443 V320 H404 V674 H377 Z" fill="url(#doorGrad)"/>
    <path d="M552 288 H630 Q653 288 653 311 V674 H625 V321 H552 Z" fill="url(#doorGrad)"/>

    <path d="M438 318
             L546 263
             Q568 252 568 277
             V704
             Q568 728 546 716
             L438 660
             Q420 651 420 632
             V350
             Q420 328 438 318 Z"
          fill="url(#doorGrad)"/>

    <circle cx="519" cy="493" r="15.5" fill="#ffffff"/>
  </g>

  <!-- video intercom -->
  <g filter="url(#shadow)">
    <rect x="675" y="405" width="58" height="108" rx="10" fill="url(#doorGrad)"/>
    <circle cx="704" cy="434" r="18" fill="#ffffff"/>
    <circle cx="704" cy="434" r="8.5" fill="url(#doorGrad)"/>
    <circle cx="704" cy="434" r="3" fill="url(#haBlue)"/>
    <path d="M690 483
             Q704 463 718 483
             V493
             Q718 500 711 500
             H697
             Q690 500 690 493 Z"
          fill="url(#haBlue)"/>
    <rect x="697" y="502" width="14" height="4" rx="2" fill="url(#haBlue)"/>
  </g>

