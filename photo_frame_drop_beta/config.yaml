name: "Photo Frame Drop Beta"
version: "1.0.0"
slug: photo_frame_drop_beta
description: "Drag & drop photos into your HA /media folder from anywhere, with a gallery and password protection. (Beta Version)"
url: "https://github.com/GwiezdnySzeryf/Gwiezdny-Szeryf-s-HA-Apps"
arch:
  - aarch64
  - amd64

init: false
hassio_api: true
homeassistant_api: true

map:
  - type: media
    read_only: false

ingress: true
ingress_port: 8100
panel_icon: mdi:image-frame
panel_title: Photo Frame Drop Beta

ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Interfejs WWW aplikacji (wymagany jeśli chcesz uzyskać dostęp po zewnętrznym IP lub domenie)"

options:
  target_folder: "digital_frame_beta"
  password: "changeme"
  max_upload_mb: 50
  allowed_extensions: "jpg,jpeg,png,gif,webp,bmp"
  notify_on_upload: false
  notify_message: "New photo added to the frame!"
  notify_on_failed_login: true
  login_description: ""

schema:
  target_folder: str
  password: str
  max_upload_mb: "int(1,500)"
  allowed_extensions: str
  notify_on_upload: bool
  notify_message: str
  notify_on_failed_login: bool
  login_description: str?

watchdog: "http://[HOST]:[PORT:8100]/health"
timeout: 10
