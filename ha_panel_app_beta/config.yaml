name: "HA Panel App Beta"
version: "0.1.1"
slug: ha_panel_app_beta
description: "Wersja beta backendu konfiguracyjnego i kontrolnego dla natywnego wallpanelu Android Home Assistant."
url: "https://github.com/GwiezdnySzeryf/Gwiezdny-Szeryf-s-HA-Apps"
arch:
  - aarch64
  - amd64

init: false
hassio_api: true
homeassistant_api: true

ingress: true
ingress_port: 8197
panel_icon: mdi:tablet-dashboard
panel_title: HA Panel Beta

ports:
  8197/tcp: 8197
ports_description:
  8197/tcp: "API i panel WWW HA Panel App Beta, wymagane dla tabletow spoza Ingress"

options:
  public_base_url: ""
  pairing_code_ttl_seconds: 600
  telemetry_stale_seconds: 120
  allow_demo_config_reset: true

schema:
  public_base_url: str?
  pairing_code_ttl_seconds: "int(60,3600)"
  telemetry_stale_seconds: "int(30,3600)"
  allow_demo_config_reset: bool

watchdog: "http://[HOST]:[PORT:8197]/health"
timeout: 10
